version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: delivale_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: delivale_followup
      POSTGRES_USER: delivale_user
      POSTGRES_PASSWORD: delivale_secure_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivale_user -d delivale_followup"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: delivale_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://delivale_user:delivale_secure_password_2026@db:5432/delivale_followup?schema=public
      SESSION_SECRET: delivale_super_secret_session_key_production_32chars
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-delivale_bot}
    ports:
      - "3000:3000"
    volumes:
      - app_uploads:/app/uploads
      - app_data:/app/data

volumes:
  postgres_data:
  app_uploads:
  app_data:
